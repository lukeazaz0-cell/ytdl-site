<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YTDL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    document.documentElement.dataset.bsTheme =
      matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  </script>
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <h1 class="h3 text-center mb-1">YTDL</h1>
        <p class="text-center text-body-secondary mb-4">Paste a YouTube link, pick a format, download.</p>

        <form id="lookup" class="input-group input-group-lg mb-3">
          <input id="url" type="url" class="form-control" placeholder="https://www.youtube.com/watch?v=…" required autofocus>
          <button id="go" class="btn btn-primary" type="submit">
            <span id="spinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
            <span>Fetch</span>
          </button>
        </form>

        <div id="error" class="alert alert-danger d-none" role="alert"></div>

        <div id="result" class="card shadow-sm d-none">
          <div class="ratio ratio-16x9">
            <img id="thumb" class="card-img-top object-fit-cover" alt="">
          </div>
          <div class="card-body">
            <h2 id="title" class="h5 card-title"></h2>
            <p id="meta" class="card-subtitle text-body-secondary mb-3"></p>
            <div class="input-group">
              <select id="format" class="form-select"></select>
              <a id="download" class="btn btn-success" href="#">Download</a>
            </div>
            <div id="preparing" class="form-text d-none">
              Preparing your file on the server — the download starts when it's ready.
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let currentUrl = "";

    function setLoading(on) {
      $("go").disabled = on;
      $("spinner").classList.toggle("d-none", !on);
    }

    function showError(msg) {
      $("error").textContent = msg;
      $("error").classList.toggle("d-none", !msg);
    }

    function updateLink() {
      const params = new URLSearchParams({ url: currentUrl, format: $("format").value });
      $("download").href = "/api/download?" + params;
    }

    $("lookup").addEventListener("submit", async (e) => {
      e.preventDefault();
      showError("");
      $("result").classList.add("d-none");
      $("preparing").classList.add("d-none");
      setLoading(true);
      try {
        currentUrl = $("url").value.trim();
        const res = await fetch("/api/info", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: currentUrl }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Something went wrong.");

        $("thumb").src = data.thumbnail || "";
        $("title").textContent = data.title;
        $("meta").textContent = [data.uploader, data.duration].filter(Boolean).join(" · ");
        $("format").replaceChildren(...data.formats.map((f) => new Option(f.label, f.id)));
        updateLink();
        $("result").classList.remove("d-none");
      } catch (err) {
        showError(err.message);
      } finally {
        setLoading(false);
      }
    });

    $("format").addEventListener("change", updateLink);
    $("download").addEventListener("click", () => $("preparing").classList.remove("d-none"));
  </script>
</body>
</html>
